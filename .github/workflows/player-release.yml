name: Build and verify Closed Alpha player installer
on:
  push:
    branches: [main]
    paths: ['alpha/build-input.json', '.github/workflows/player-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-release
  cancel-in-progress: true
jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Reconstruct and verify exact player distribution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $inputData=Get-Content alpha/build-input.json -Raw | ConvertFrom-Json
          Expand-Archive -LiteralPath build/player-without-runtime.zip -DestinationPath payload
          $runtime=Join-Path payload ('versions/'+$inputData.version+'/runtime/node.exe')
          Invoke-WebRequest 'https://nodejs.org/dist/v24.22.0/win-x64/node.exe' -OutFile $runtime
          if((Get-FileHash $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ba93f9a70bd86fce3ebbb39ec758501458453467aa92a34a0a3602d1e3fc2b9c'){throw 'Runtime hash mismatch'}
          if((Get-AuthenticodeSignature $runtime).Status -ne 'Valid'){throw 'Runtime Windows signature invalid'}
          Invoke-WebRequest 'https://raw.githubusercontent.com/nodejs/node/v24.22.0/LICENSE' -OutFile (Join-Path payload ('versions/'+$inputData.version+'/runtime/LICENSE'))
          & $runtime -e "const f=require('fs'),m=JSON.parse(f.readFileSync('alpha/player-stable-next.json'));f.writeFileSync('payload/versions/'+m.release.version+'/trusted-release.json',JSON.stringify(m));"
          & $runtime build/ci-reconstruct-player.mjs
          if($LASTEXITCODE -ne 0){throw 'Signed reconstruction failed'}
          $audit=Get-Content alpha/player-file-audit.json -Raw | ConvertFrom-Json
          if(@(Get-ChildItem payload -Recurse -File).Count -ne $audit.files.Count){throw 'Unexpected player file count'}
          foreach($file in $audit.files){$p=Join-Path payload $file.path;if((Get-Item $p).Length -ne $file.bytes -or (Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256){throw ('Player file mismatch: '+$file.path)}}
          New-Item -ItemType Directory installer | Out-Null
          Copy-Item ('payload/versions/'+$inputData.version+'/app/public/asset/reborn-app.ico') installer/Reborn.ico
      - name: Build per-user installer
        shell: pwsh
        run: |
          Start-Transcript -Path installer-build-output.txt
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          node build/make-player-installer.mjs payload installer ((Get-Content alpha/build-input.json -Raw | ConvertFrom-Json).installerVersion) 2>&1 | Tee-Object -FilePath installer-native-output.txt
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          Stop-Transcript
      - name: Stage signed update without promoting installer or stable feeds
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content alpha/build-input.json -Raw | ConvertFrom-Json).version
          gh release view "alpha-$v" *> $null
          if($LASTEXITCODE -ne 0){gh release create "alpha-$v" --prerelease --target '${{ github.sha }}' --title "Closed Alpha $v - validation in progress" --notes 'Staged signed player update. Installer validation has not finished.'}
          gh release upload "alpha-$v" "RebornClient-$v.zip" --clobber
          if($LASTEXITCODE -ne 0){throw 'Staged update upload failed'}
      - name: Previous installer to real HTTPS signed update and native launch
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/alexaa1212ss/game/releases/download/alpha-0.4.5/CavegameRebornSetup.msi' -OutFile previous.msi
          if((Get-FileHash previous.msi -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7e29f583b0138ccc7c8cf708e852c4ee7f2f4d7ea349ed767cb7663ef949d319'){throw 'Previous MSI hash mismatch'}
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$((Resolve-Path previous.msi).Path)`"",'/qn','/norestart','/L*v','previous-install.log') -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Previous installer failed'}
          # Explicit signed staging directory for this clean CI fixture only.
          # Public stable feeds still point to the previous released build.
          Copy-Item alpha/candidate-player-config.json (Join-Path $env:LOCALAPPDATA 'Programs/CavegameReborn/player-config.json') -Force
          $env:CAVEGAME_TEST_OLD_LAUNCHER='1'
          node build/ci-player-acceptance.mjs
          Remove-Item Env:CAVEGAME_TEST_OLD_LAUNCHER
          if($LASTEXITCODE -ne 0){throw 'Installed agreement/update/public gameplay acceptance failed'}
          $pointer=Get-Content (Join-Path $env:LOCALAPPDATA 'Programs/CavegameReborn/installed.json') -Raw | ConvertFrom-Json
          if($pointer.current -ne (Get-Content alpha/build-input.json -Raw | ConvertFrom-Json).version){throw 'HTTPS update did not activate'}
          $identity=Join-Path $env:LOCALAPPDATA 'CavegameReborn/identity/identity.json'
          $before=(Get-FileHash $identity).Hash
          & ./build/ci-installer-ui.ps1
          if((Get-FileHash $identity).Hash -ne $before){throw 'MSI upgrade changed identity'}
          Copy-Item alpha/candidate-player-config.json (Join-Path $env:LOCALAPPDATA 'Programs/CavegameReborn/player-config.json') -Force
          node build/ci-player-acceptance.mjs
          if($LASTEXITCODE -ne 0){throw 'New MSI gameplay acceptance failed'}
      - name: Real Edge ordinary input and persisted-receipt session recovery
        timeout-minutes: 4
        shell: pwsh
        run: |
          node build/ci-browser-input.mjs
          if($LASTEXITCODE -ne 0){throw 'Actual browser input/recovery acceptance failed'}
      - name: Uninstall keeps identity and acceptance
        shell: pwsh
        run: |
          $identity=Join-Path $env:LOCALAPPDATA 'CavegameReborn/identity/identity.json'
          $receipt=Join-Path $env:LOCALAPPDATA 'CavegameReborn/alpha-agreement.json'
          $before=(Get-FileHash $identity).Hash;$consent=(Get-FileHash $receipt).Hash
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$((Resolve-Path installer/CavegameRebornSetup.msi).Path)`"",'/qn','/norestart','/L*v','uninstall.log') -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Uninstall failed'}
          if((Get-FileHash $identity).Hash -ne $before -or (Get-FileHash $receipt).Hash -ne $consent){throw 'Uninstall changed identity/agreement'}
          if(Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/CavegameReborn/Cavegame Reborn.exe')){throw 'Client executable remains installed'}
      - name: Promote verified player installer and signed stable directory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v=(Get-Content alpha/build-input.json -Raw | ConvertFrom-Json).version
          Get-FileHash installer/CavegameRebornSetup.msi -Algorithm SHA256 | Format-List | Out-File installer/SHA256.txt
          gh release upload "alpha-$v" installer/CavegameRebornSetup.msi installer/SHA256.txt alpha/player-stable-next.json alpha/player-file-audit.json player-acceptance.json --clobber
          if($LASTEXITCODE -ne 0){throw 'Installer upload failed'}
          Copy-Item alpha/player-stable-next.json alpha/player-stable.json -Force
          Copy-Item alpha/channel-next.json alpha/channel.json -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha/player-stable.json alpha/channel.json
          git commit -m "Activate verified Closed Alpha $v player directory"
          git push
          if($LASTEXITCODE -ne 0){throw 'Stable directory activation failed'}
          gh release edit "alpha-$v" --prerelease=false --latest --title "Cavegame Reborn Closed Alpha $v" --notes-file ALPHA-NOTES.md
          if($LASTEXITCODE -ne 0){throw 'Release promotion failed'}
      - name: Verify canonical latest download and install that exact artifact
        shell: pwsh
        run: |
          $url='https://github.com/alexaa1212ss/game/releases/latest/download/CavegameRebornSetup.msi'
          $r=Invoke-WebRequest $url -OutFile canonical.msi -PassThru
          $expected=(Get-FileHash installer/CavegameRebornSetup.msi -Algorithm SHA256).Hash
          $actual=(Get-FileHash canonical.msi -Algorithm SHA256).Hash
          if($actual -ne $expected){throw 'Canonical latest link differs from intended MSI'}
          @{url=$url;version=(Get-Content alpha/build-input.json -Raw | ConvertFrom-Json).version;sha256=$actual.ToLowerInvariant();bytes=(Get-Item canonical.msi).Length;verified=$true;at=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json | Out-File canonical-download-verification.json -Encoding utf8
          $p=Start-Process msiexec.exe -ArgumentList @('/i',"`"$((Resolve-Path canonical.msi).Path)`"",'/qn','/norestart','/L*v','canonical-install.log') -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Canonical installer failed'}
          node build/ci-player-acceptance.mjs
          if($LASTEXITCODE -ne 0){throw 'Canonical package default configuration failed'}
          $p=Start-Process msiexec.exe -ArgumentList @('/x',"`"$((Resolve-Path canonical.msi).Path)`"",'/qn','/norestart') -Wait -PassThru -WindowStyle Hidden
          if($p.ExitCode -ne 0){throw 'Canonical package uninstall failed'}
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-diagnostics
          path: |
            *install*.log
            installer-build-output.txt
            installer-native-output.txt
            installer/wix-result.json
            player-acceptance.json
            ordinary-browser-report.json
            ordinary-browser.png
            canonical-download-verification.json
            installer/Player.wxs
            installer/CavegameRebornSetup.msi
          retention-days: 14
      - name: Publish non-sensitive installer build failure diagnostic
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if(Test-Path installer-build-output.txt){
            $text=Get-Content installer-build-output.txt -Raw
            $native=if(Test-Path installer/wix-result.json){Get-Content installer/wix-result.json -Raw}else{'No native result'}
            $data=@{run='${{ github.run_id }}';buildOutput=$text;native=$native}|ConvertTo-Json
            $body=@{message='Retain installer compiler diagnostic';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($data))}|ConvertTo-Json
            $body|Out-File diagnostic-upload.json -Encoding utf8
            gh api --method PUT 'repos/${{ github.repository }}/contents/alpha/installer-diagnostic-${{ github.run_id }}.json' --input diagnostic-upload.json
          }

