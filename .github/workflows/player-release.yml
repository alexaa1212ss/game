name: Build and verify Windows player installer
on:
  push:
    branches: [main]
    paths: ['alpha/build-input.json', '.github/workflows/player-release.yml', 'build/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-release
  cancel-in-progress: false
jobs:
  windows-installer:
    if: "!contains(github.event.head_commit.message, '[candidate]')"
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and hash-verify audited player material
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputData = Get-Content alpha/build-input.json -Raw | ConvertFrom-Json
          Expand-Archive -LiteralPath build/player-without-runtime.zip -DestinationPath payload
          $runtime = Join-Path payload ('versions/' + $inputData.version + '/runtime/node.exe')
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.14.0/win-x64/node.exe' -OutFile $runtime
          if ((Get-FileHash -LiteralPath $runtime -Algorithm SHA256).Hash.ToLowerInvariant() -ne '63c259c81e5d472b5f11c8d506070130cb04a1ecf84b80377a34ed6ec9048088') { throw 'Official Node runtime hash mismatch' }
          & $runtime build/ci-reconstruct-player.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Signed update reconstruction failed' }
          $audit = Get-Content alpha/player-file-audit.json -Raw | ConvertFrom-Json
          $actual = @(Get-ChildItem payload -Recurse -File)
          if ($actual.Count -ne $audit.files.Count) { throw 'Unexpected package file count' }
          foreach ($file in $audit.files) {
            $target = Join-Path payload $file.path
            if ((Get-Item -LiteralPath $target).Length -ne $file.bytes -or (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) { throw "Package audit failed: $($file.path)" }
          }
          New-Item -ItemType Directory -Path installer | Out-Null
          $png = [IO.File]::ReadAllBytes('payload/versions/' + $inputData.version + '/app/public/asset/icon.ico')
          $header = New-Object byte[] 22
          $header[2]=1; $header[4]=1; $header[6]=48; $header[7]=48; $header[10]=1; $header[12]=32
          [BitConverter]::GetBytes([uint32]$png.Length).CopyTo($header,14)
          [BitConverter]::GetBytes([uint32]22).CopyTo($header,18)
          [IO.File]::WriteAllBytes((Join-Path $PWD 'installer/Reborn.ico'), [byte[]]($header+$png))
      - name: Install pinned official WiX build tool
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build normal per-user MSI
        shell: pwsh
        run: node build/make-player-installer.mjs payload installer
      - name: Install on clean Windows runner
        shell: pwsh
        run: |
          $installer = (Resolve-Path installer/CavegameRebornSetup.msi).Path
          $installProcess = Start-Process msiexec.exe -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart', '/L*v', 'install.log') -Wait -PassThru -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) { throw "Installer exit $($installProcess.ExitCode)" }
          node build/ci-player-acceptance.mjs --offline-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Installed player acceptance failed' }
      - name: Uninstall and preserve identity
        shell: pwsh
        run: |
          $identity = Join-Path $env:LOCALAPPDATA 'CavegameReborn/identity/identity.json'
          $before = (Get-FileHash -LiteralPath $identity).Hash
          $installer = (Resolve-Path installer/CavegameRebornSetup.msi).Path
          $removeProcess = Start-Process msiexec.exe -ArgumentList @('/x', "`"$installer`"", '/qn', '/norestart', '/L*v', 'uninstall.log') -Wait -PassThru -WindowStyle Hidden
          if ($removeProcess.ExitCode -ne 0) { throw "Uninstall exit $($removeProcess.ExitCode)" }
          if ((Get-FileHash -LiteralPath $identity).Hash -ne $before) { throw 'Uninstall changed identity' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs/CavegameReborn/Cavegame Reborn.exe')) { throw 'Launcher left installed' }
      - name: Publish player-only alpha release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $inputData = Get-Content alpha/build-input.json -Raw | ConvertFrom-Json
          Get-FileHash installer/CavegameRebornSetup.msi -Algorithm SHA256 | Format-List | Out-File installer/SHA256.txt
          gh release create "alpha-$($inputData.version)" installer/CavegameRebornSetup.msi installer/SHA256.txt "RebornClient-$($inputData.version).zip" alpha/player-stable.json alpha/player-file-audit.json player-acceptance.json --title "Cavegame Reborn Alpha $($inputData.version)" --notes-file ALPHA-NOTES.md --latest
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-diagnostics
          path: |
            install.log
            uninstall.log
            player-acceptance.json
            installer/Player.wxs
          retention-days: 14
